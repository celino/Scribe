name: CodeQL

# Static analysis of the core (Source/Core, plain C#). The KSP module is not analysed: it needs the game's assemblies,
# which cannot be redistributed (see docs/adr/0005-in-game-tests-run-locally-only.md).

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]
  schedule:
    - cron: "17 4 * * 1"

permissions:
  contents: read
  security-events: write

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "8.0.x"

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: csharp
          build-mode: manual

      - name: Build the core
        run: dotnet build Source/Core/Scribe.Core.csproj -warnaserror

      - name: Analyze
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:csharp"
