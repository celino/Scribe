name: Validate and test

# Gitea Actions. Checks the repo and runs the ledger tests on every push and PR.
# The zip is not built here: the DLL is not in git, so the release zip comes from a local build (see README).

on:
  push:
    branches: [ "master" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            python3 tools/validate.py --tag "${{ github.ref_name }}"
          elif [ "${{ github.event_name }}" = "pull_request" ]; then
            python3 tools/validate.py --release
          else
            python3 tools/validate.py
          fi

      - name: Python tests
        run: python3 -I -m unittest discover -s tests -p "test_*.py"

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Unit tests with coverage
        run: |
          dotnet test tests/Scribe.Tests/Scribe.Tests.csproj -warnaserror \
            --settings tests/coverlet.runsettings --results-directory tests/TestResults \
            --logger "trx;LogFileName=unit.trx"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: test-results
          path: tests/TestResults
          if-no-files-found: ignore

  # The in-game rounds (tests/ingame, docs/TESTING.md). Homelab only: it drives the host's Docker daemon through the socket
  # act_runner mounts into every job, opens KSP in a window on the host's display (software rendering stalls, so the
  # container uses the host GPU) and takes about 20 minutes. It runs on tags and on demand, not on every push.
  # The installs are made once on the host:  tools/ksp-dev-create.sh --ksp <KSP> --dest <dir> --scenario minimal|kct
  ksp-test:
    needs: build
    if: github.ref_type == 'tag' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    env:
      DISPLAY: ":0"
      CI_ROOT: /mnt/projects/projects/ksp/ci
      MINIMAL: /mnt/projects/projects/ksp/mods/Scribe/ksp-test/install-minimal
      KCT: /mnt/projects/projects/ksp/mods/Scribe/ksp-test/install-kct
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Rounds on the minimal install
        env:
          RUN_ID: ${{ github.run_id }}-minimal
        run: |
          KSP_INSTALL="$MINIMAL" ROUNDS="tx revert flight dock bench menu noscribe" sh tools/ksp-ingame-ci.sh
          mv ksp-test ksp-test-minimal

      - name: Round on the Kerbal Construction Time install
        env:
          RUN_ID: ${{ github.run_id }}-kct
        run: |
          KSP_INSTALL="$KCT" ROUNDS="kct" sh tools/ksp-ingame-ci.sh
          mv ksp-test ksp-test-kct

      - name: Upload logs and results
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: ingame-rounds
          path: |
            ksp-test-minimal
            ksp-test-kct
          if-no-files-found: ignore
