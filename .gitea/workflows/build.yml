name: Validate and test

# Gitea Actions. Checks the repo and runs the ledger tests on every push and PR.
# The zip is not built here: the DLL is not in git, so the release zip comes from a local build (see README).

on:
  push:
    branches: [ "master" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            python3 tools/validate.py --tag "${{ github.ref_name }}"
          else
            python3 tools/validate.py
          fi

      - name: Ledger tests
        run: |
          if command -v dotnet >/dev/null 2>&1; then
            dotnet run --project tests/Regression.csproj
          else
            sh tests/run.sh
          fi
